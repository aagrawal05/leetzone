<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>LeetZone</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="mark">[&middot;]</span>
    <span>LeetZone</span>
    <span class="grow"></span>
    <span class="muted" id="version"></span>
  </header>
  <main>
    <p id="who"></p>
    <p id="lobby" class="muted"></p>
    <button id="open" type="button"></button>
    <p class="note">While you are in a lobby, LeetZone sends the result of each LeetCode
    submission you make (problem, verdict, tests passed, language) to the LeetZone
    server. It never reads your code. <a id="privacy" href="#">Privacy</a></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
