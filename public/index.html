<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>leetzone</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='12 12 104 104'%3E%3Cstyle%3Epath%7Bfill:none;stroke:%23c2410c%7Dcircle%7Bfill:%23c2410c%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fb923c%7Dcircle%7Bfill:%23fb923c%7D%7D%3C/style%3E%3Cg stroke-width='16' stroke-linecap='square'%3E%3Cpath d='M44 20H22v88h22'/%3E%3Cpath d='M84 20h22v88H84'/%3E%3C/g%3E%3Ccircle cx='64' cy='64' r='14'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">skip to content</a>

  <header class="top">
    <a class="wordmark" href="/">leetzone</a>
    <nav aria-label="main">
      <a href="/" data-nav="play">play</a>
      <a href="/leaderboard" data-nav="leaderboard">leaderboard</a>
    </nav>
    <div class="who" id="who" hidden>
      <button type="button" class="who-name" id="who-name" aria-haspopup="true" aria-expanded="false" aria-controls="who-menu"></button>
      <div class="who-menu" id="who-menu" hidden>
        <a id="who-profile" href="/">profile</a>
        <button type="button" id="who-copy">copy login link</button>
        <button type="button" id="who-out">sign out</button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <p class="muted">loading</p>
  </main>

  <footer class="bottom">
    <span><span id="ext-status" class="muted"></span> <a id="ext-install" class="muted" href="https://chromewebstore.google.com/detail/nomfblgjdallmehppjfblkheoioclkbj" target="_blank" rel="noopener" hidden>install</a></span>
    <a class="muted" href="/privacy" target="_blank" rel="noopener">privacy</a>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="notice">leetzone needs JavaScript.</p></noscript>
</body>
</html>
